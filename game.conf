# game.conf: what tools/native-build.sh needs to know about this game. No game data in here.
TITLE="Mario & Sonic at the Rio 2016 Olympic Games"
NAME=rio
RPX=unison.rpx
TESTED_TITLE_ID=00050000101E5400
TESTED_REGION="Europe"
RECOMP_ARGS="--any-rpx"
BUILD_MINUTES=8-20
DISK_GB=2
# Needed: the Mii resource title (0005001B-10056000) of your own Wii U - without Miis the game stops after loading.
SYS_TITLES=10056000
SYS_NOTE_DE="WICHTIG: Ohne die Mii-Dateien deiner eigenen Wii U (-SysDir / --sys, Ordner mlc01/sys) bleibt Rio nach dem Ladebild stehen."
SYS_NOTE_EN="IMPORTANT: without the Mii files of your own Wii U (-SysDir / --sys, an mlc01/sys folder) Rio stops after the loading screen."
